      - 'src/ndi/+ndi/+dataset/dir.m'
      - 'src/ndi/+ndi/+session/dir.m'
      - 'src/ndi/+ndi/session.m'
      - 'src/ndi/+ndi/subject.m'
      - 'src/ndi/+ndi/+file/navigator.m'
      - 'src/ndi/+ndi/+daq/system.m'
      - 'src/ndi/+ndi/statement.m'
      - 'src/ndi/+ndi/assertion.m'
      - 'src/ndi/+ndi/interaction.m'
      - 'src/ndi/+ndi/observation.m'
      - 'src/ndi/+ndi/manipulation.m'
      - 'src/ndi/+ndi/calculation.m'
      - 'src/ndi/+ndi/data_type.m'
      - 'tests/+ndi/+unittest/+vintage/**'
      - 'src/ndi/+ndi/+fun/+doc/+lightsheet/**'
      - 'src/ndi/+ndi/+gui/+app/LightsheetZarrManager.m'
      - 'src/ndi/+ndi/+database/+fun/extract_docs_files.m'
      - 'src/ndi/+ndi/+database/+internal/list_binary_files.m'
      - 'tests/+ndi/+unittest/+fun/+doc/+lightsheet/**'
      - 'tests/+ndi/+unittest/+gui/+app/TestLightsheetZarrManager.m'
      - 'src/ndi/+ndi/+database/+implementations/+database/didsqlite.m'
      - 'tests/+ndi/+unittest/+database/TestV1SubjectSearch.m'
      - 'src/ndi/+ndi/+cloud/+sync/+internal/reconstructSeriesIngestLocations.m'
      - 'src/ndi/+ndi/+cloud/+sync/+internal/updateFileInfoForLocalFiles.m'
      - 'src/ndi/+ndi/+cloud/+sync/+internal/updateFileInfoForRemoteFiles.m'
      - 'tests/+ndi/+unittest/ReconstructSeriesIngestLocationsTest.m'
      - 'src/ndi/+ndi/+migrate/+internal/withSessionId.m'
      - 'tests/+ndi/+unittest/+migrate/TestMigrateSessionId.m'
      - '.github/workflows/test-import-v2.yml'
  workflow_dispatch:

concurrency:
  # Keyed on the commit: a push never cancels another commit's run;
  # only a duplicate run of the same commit is cancelled.
  group: test-import-v2-${{ github.sha }}
  cancel-in-progress: true

jobs:
  import-v2:
    name: V2 import stages
    runs-on: ubuntu-latest
    env:
      # did-schema #88 merged into main and DID-matlab #218 into V2 (2026-10-23)
      DID_SCHEMA_REQUESTED: ''
      DID_MATLAB_REQUESTED: ''
      NDI_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Check out NDI-matlab
        uses: actions/checkout@v4

      - name: Resolve cross-repo refs (print them; fail if one is missing)
        # A requested ref that does not exist must STOP the run, never fall back
        # to a default branch: a run against the wrong did-schema / DID-matlab
        # reads exactly like a run against the right one. Each ref is resolved
        # to a commit here, the checkouts below use that commit, and the log
        # says which commit every later step measured.
        run: |
          set -euo pipefail
          resolve() {  # <owner/repo> <ref> <env var for the sha>
            local sha
            sha=$(git ls-remote "https://github.com/$1.git" "refs/heads/$2" "refs/tags/$2^{}" "refs/tags/$2" | head -1 | cut -f1)
            if [ -z "$sha" ] && [[ "$2" =~ ^[0-9a-f]{40}$ ]]; then sha="$2"; fi
            if [ -z "$sha" ]; then
              echo "::error::$1 has no branch, tag or commit '$2'. Refusing to fall back to any other ref."
              exit 1
            fi
            echo "RESOLVED: $1 @ $2 = $sha"
            echo "$3=$sha" >> "$GITHUB_ENV"
          }
          # did-schema: the requested ref, else the did-schema branch with this
          # NDI-matlab branch's name, else main ([NDI CI picks did-schema
          # branch], Jess Haley, 2026-10-27), the same rule as DID-matlab below.
          DID_SCHEMA_REF="${DID_SCHEMA_REQUESTED:-}"
          if [ -z "$DID_SCHEMA_REF" ] && [ -n "${NDI_BRANCH:-}" ] && [ "$NDI_BRANCH" != "main" ] \
             && [ -n "$(git ls-remote https://github.com/Waltham-Data-Science/did-schema.git "refs/heads/$NDI_BRANCH")" ]; then
            DID_SCHEMA_REF="$NDI_BRANCH"
          fi
          DID_SCHEMA_REF="${DID_SCHEMA_REF:-main}"
          echo "PICKED: did-schema ref $DID_SCHEMA_REF (requested '${DID_SCHEMA_REQUESTED:-}', NDI branch '${NDI_BRANCH:-}')"
          echo "DID_SCHEMA_REF=$DID_SCHEMA_REF" >> "$GITHUB_ENV"
          resolve Waltham-Data-Science/did-schema "$DID_SCHEMA_REF" DID_SCHEMA_SHA
          # DID-matlab: the requested ref, else the DID-matlab branch with this
          # NDI-matlab branch's name, else V2 ([NDI CI picks DID branch], Jess
          # Haley, 2026-10-25), so a DID/NDI pair is tested together.
          DID_MATLAB_REF="${DID_MATLAB_REQUESTED:-}"
          if [ -z "$DID_MATLAB_REF" ] && [ -n "${NDI_BRANCH:-}" ] && [ "$NDI_BRANCH" != "main" ] \
             && [ -n "$(git ls-remote https://github.com/VH-Lab/DID-matlab.git "refs/heads/$NDI_BRANCH")" ]; then
            DID_MATLAB_REF="$NDI_BRANCH"
          fi
          DID_MATLAB_REF="${DID_MATLAB_REF:-V2}"
          echo "PICKED: DID-matlab ref $DID_MATLAB_REF (requested '${DID_MATLAB_REQUESTED:-}', NDI branch '${NDI_BRANCH:-}')"
          echo "DID_MATLAB_REF=$DID_MATLAB_REF" >> "$GITHUB_ENV"
          resolve VH-Lab/DID-matlab "$DID_MATLAB_REF" DID_MATLAB_SHA

      - name: Check out did-schema
        uses: actions/checkout@v4
        with:
          repository: Waltham-Data-Science/did-schema
          ref: ${{ env.DID_SCHEMA_SHA }}
          path: did-schema

      - name: Assemble the V2 schema set
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/eta-schemas"
          # Both layouts: the tiers (stable/, draft/, deprecated/ if present) and
          # the flat schemas/did_v2/*.json of [one folder, final classes only]
          # (Jess Haley, 2026-10-29); did_v2/ or V_eta/ ([schema set renamed
          # did_v2]). See the script's header.
          bash .github/scripts/assemble_did_schema_set.sh did-schema "${GITHUB_WORKSPACE}/eta-schemas"
          echo "DENOMINATOR: $(ls "${GITHUB_WORKSPACE}/eta-schemas" | wc -l) schema file(s) from did-schema@$(git -C did-schema rev-parse --short HEAD)"
          echo "DID_SCHEMA_PATH=${GITHUB_WORKSPACE}/eta-schemas" >> "$GITHUB_ENV"

      - name: Check out DID-matlab
        uses: actions/checkout@v4
        with:
          repository: VH-Lab/DID-matlab
          ref: ${{ env.DID_MATLAB_SHA }}
          path: did-matlab

      - name: Print the checked-out cross-repo commits
        run: |
          set -euo pipefail
          s=$(git -C did-schema rev-parse HEAD); d=$(git -C did-matlab rev-parse HEAD)
          echo "CHECKED OUT: did-schema ${DID_SCHEMA_REF} = ${s}"
          echo "CHECKED OUT: DID-matlab ${DID_MATLAB_REF} = ${d}"
          [ "$s" = "$DID_SCHEMA_SHA" ] || { echo "::error::did-schema is at $s, resolved $DID_SCHEMA_SHA"; exit 1; }
          [ "$d" = "$DID_MATLAB_SHA" ] || { echo "::error::DID-matlab is at $d, resolved $DID_MATLAB_SHA"; exit 1; }

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          # PINNED: `latest` moved to R2026b (2026-10-01), whose
          # matlab.addons.install no longer accepts the agreeToLicense argument
          # MatBox's installFexPackage passes, so dependency install fails before
          # any test runs. Unpin when MatBox is updated.
          release: R2026a
          cache: true

      - name: Install MatBox
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: ehennestad/matbox-actions/install-matbox@v1

      - name: Install repo dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(genpath("src"));
            addpath(genpath("tools"));
            matbox.installRequirements(nditools.projectdir());
            matbox.installRequirements(fullfile(pwd, "tests"));

      - name: Run the V2 import tests
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(genpath("src"));
            addpath(genpath("tests"));
            % ndr.reader.video is in the installed NDR main (VH-Lab/NDR-matlab#140)
            disp("NDR video reader: " + string(which("ndr.reader.video")) + "; known readers: " + strjoin(string(ndr.known_readers()), ", "));
            % ahead of the installed DID-matlab V2 on the path
            addpath(genpath(fullfile(pwd, "did-matlab", "src")));
            disp("DID-matlab from did-matlab (" + string(which("did2.build.document")) + ")");
            import matlab.unittest.TestSuite;
            suite = [TestSuite.fromPackage("ndi.unittest.setup.V2", "IncludingSubpackages", true), ...
                     TestSuite.fromClass(?ndi.unittest.vintage.TestVintageMap), ...
                     TestSuite.fromClass(?ndi.unittest.vintage.TestLightsheetVintage), ...
                     TestSuite.fromClass(?ndi.unittest.vintage.TestLightsheetMigratedSession), ...
                     TestSuite.fromClass(?ndi.unittest.vintage.TestLightsheetMigrated), ...
                     TestSuite.fromClass(?ndi.unittest.migrate.TestMigrateSessionId)];
            results = run(suite);
            disp(table(results));
            nRun = numel(results);
            nFailed = sum([results.Failed]);
            nIncomplete = sum([results.Incomplete]);
            fprintf("VERDICT: %d run, %d failed, %d filtered\n", nRun, nFailed, nIncomplete);
            assert(nRun > 0, "no V2 import tests were selected");
            assert(nFailed == 0, sprintf("%d V2 import test(s) failed", nFailed));
            assert(nIncomplete == 0, sprintf("%d V2 import test(s) were FILTERED -- did2.build or the schema is missing", nIncomplete));

      - name: Run the v1 lightsheet reader tests (v1 must read exactly as before)
        # The lightsheet readers now route through ndi.vintage so they also
        # read a MIGRATED pyramid. These are the existing v1 tests (legacy
        # session, documents makePyramid writes), otherwise run only by
        # run-tests.yml on main/Vnext; here so a branch that touches the
        # readers proves v1 unchanged. A filtered test (a missing optional
        # dependency) is reported, not counted as a pass, and not a failure.
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(genpath("src"));
            addpath(genpath("tests"));
            addpath(genpath(fullfile(pwd, "did-matlab", "src")));
            % as run-tests.yml runs them: no V2 schema set
            setenv("DID_SCHEMA_PATH", "");
            import matlab.unittest.TestSuite;
            suite = [TestSuite.fromClass(?ndi.unittest.fun.doc.lightsheet.TestLevelTable), ...
                     TestSuite.fromClass(?ndi.unittest.fun.doc.lightsheet.TestChooseLevel), ...
                     TestSuite.fromClass(?ndi.unittest.fun.doc.lightsheet.TestMakePyramid), ...
                     TestSuite.fromClass(?ndi.unittest.fun.doc.lightsheet.TestFromSPIM), ...
                     TestSuite.fromClass(?ndi.unittest.gui.app.TestLightsheetZarrManager), ...
                     TestSuite.fromClass(?ndi.unittest.database.TestV1SubjectSearch), ...
                     TestSuite.fromClass(?ndi.unittest.ReconstructSeriesIngestLocationsTest)];
            results = run(suite);
            disp(table(results));
            nRun = numel(results);
            nFailed = sum([results.Failed]);
            nIncomplete = sum([results.Incomplete]);
            fprintf("VERDICT (v1 lightsheet): %d run, %d failed, %d filtered\n", nRun, nFailed, nIncomplete);
            assert(nRun > 0, "no v1 lightsheet tests were selected");
            assert(nFailed == 0, sprintf("%d v1 lightsheet test(s) failed", nFailed));
