name: Run NDI Test Suite Cloud Prod

on:
  # This suite creates, uploads files to, publishes, unpublishes and deletes
  # datasets against the PRODUCTION NDI Cloud API (api.ndi-cloud.com). It must
  # NOT run on every push / pull_request: a cancelled or SIGKILLed runner skips
  # MATLAB teardown and can orphan synthetic (possibly published) datasets in
  # the public commons. Restrict it to manual dispatch and a nightly schedule
  # so writes happen on a predictable, low-contention cadence.
  #
  # push/pull_request gating for the dev stage lives in test-cloud-api.yml.
  # NOTE for Steve: main's branch protection / required checks must be updated
  # to stop requiring this workflow before it can be retargeted off main.
  workflow_dispatch:
  schedule:
    # 07:00 UTC nightly (off-peak for US/EU contributors).
    - cron: '0 7 * * *'

concurrency:
  # Do NOT cancel in progress: a cancelled runner is SIGKILLed before MATLAB
  # teardown (addTeardown/deleteDatasetAfterTest) runs, orphaning prod datasets.
  # Serialize instead so a new run waits for the current one to finish cleanly.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run_tests:
    name: Cloud CI ${{ matrix.part }}
    runs-on: ubuntu-latest
    # matbox dependency resolution calls the GitHub API; authenticate so the
    # requests aren't unauthenticated-rate-limited (which surfaced as webread
    # timeouts when several jobs install in parallel).
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    steps:
      - name: Check out repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@aa8bbc7b76daa63c5d456d1430cbd6cb5b626ab4 # v2
        with:
          release: latest
          cache: true

      - name: Clone NDIcalc-vis-matlab as sibling directory
        run: git clone https://github.com/VH-Lab/NDIcalc-vis-matlab.git ../NDIcalc-vis-matlab

      - name: Install MatBox
        uses: ehennestad/matbox-actions/install-matbox@8fe220fbaec9e119ec5081eb917c8e016e275f1e # v1

      - name: Run tests
        uses: matlab-actions/run-command@37b454c384483087929a3d652be474ba585a9659 # v2
        with:
          command: |
            setenv("NDI_CLOUD_USERNAME", "${{ secrets.NDI_CLOUD_USERNAME }}")
            setenv("NDI_CLOUD_PASSWORD", "${{ secrets.NDI_CLOUD_PASSWORD }}")
            setenv("GITHUB_TOKEN", "${{ github.token }}")
            setenv("NDI_CLOUD_TEST_USER_HAS_MATLAB_LICENSE", "false")
            addpath(genpath( "src" ));
            addpath(genpath( "tests" ));
            addpath(genpath( "tools" ));
            ndi.cloud.authenticate("InteractionEnabled", "off")
            testCloudApiProdPart(${{ matrix.part }}, 3)

      # Publish test results
      - name: Publish test results
        uses: mikepenz/action-junit-report@db71d41eb79864e25ab0337e395c352e84523afe # v4
        if: always()
        with:
          report_paths: 'docs/reports/test-results.xml'
          check_name: 'Cloud CI ${{ matrix.part }} test results'
