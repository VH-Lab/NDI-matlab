name: V_eta migrate B (on-demand)

# Corpus B (12,917 v1 documents, ~18 MB compressed: the Fitzpatrick tree-shrew
# dataset `2013_treeshrew_LGNctx`) through the WHOLE V_eta pipeline:
# ndi.migrate.local over the real corpus, then open the result through
# ndi.session.dir and read it back through the object API.
#
# WHY B HAS ITS OWN, DISPATCH-ONLY WORKFLOW. B holds all 1,242 vhlab NewStim
# `stimulus_presentation` documents (53,144 stimuli) these corpora carry, and
# they are what the stimulus second pass folds to method documents and one
# `item` manipulation (ndi.migrate.internal.stimulusPresentationToItem), or
# refuses by NewStim class. Those checks used to ride inside the Dab e2e,
# because Dab.zip bundles the whole of B beside Dabrowska's sessions; Jess
# Haley, 2026-10-21, moved them here so the Dab tests read only Dabrowska's
# documents. The corpus is the same B.zip DID-matlab's testCorpusB reads. Run
# alone, with a generous timeout, and never on every push: it does not gate the
# fast e2e check.
#
# The dep refs default to the same-name branch, else did-schema `main` and DID-matlab `V2` (DID_SCHEMA_REF
# and DID_MATLAB_REF below; #88 and #218 merged 2026-10-23); override the
# DID-matlab ref via the workflow_dispatch input if needed.

on:
  # Runs ONLY when B's own files change -- the test or this workflow -- so a
  # long B run never rides on an unrelated push and never gates the fast e2e
  # check. workflow_dispatch below only becomes available once this file reaches
  # the default branch (a GitHub constraint), so the scoped push is what runs
  # B from a feature branch until then.
  push:
    paths:
      - '.github/workflows/test-eta-migrate-b.yml'
      - 'tests/*ndi/*unittest/*migrate/TestMigrateLocalEtaB.m'
  workflow_dispatch:
    inputs:
      ref:
        description: 'did-matlab / did-schema branch (V_eta line)'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # false: a push queues behind a run in progress instead of cancelling it.
  cancel-in-progress: false

jobs:
  eta_migrate_b:
    name: V_eta B end-to-end (on-demand)
    runs-on: ubuntu-latest
    # Generous headroom. B migrated inside the Dab e2e, whose whole test step
    # took ~2h10m over B plus Dabrowska; B alone is set well above its share.
    timeout-minutes: 180
    env:
      # did-schema #88 merged into main and DID-matlab #218 into V2
      # (2026-10-23): validate against them. A workflow_dispatch input still
      # overrides the DID-matlab ref.
      DID_MATLAB_REQUESTED: ${{ inputs.ref }}
      NDI_BRANCH: ${{ github.head_ref || github.ref_name }}
      DID_SCHEMA_REQUESTED: ''
    steps:
      - name: Check out NDI-matlab
        uses: actions/checkout@v4

      - name: Resolve cross-repo refs (print them; fail if one is missing)
        # A requested ref that does not exist must STOP the run, never fall back
        # to a default branch: a run against the wrong did-schema / DID-matlab
        # reads exactly like a run against the right one. Each ref is resolved
        # to a commit here, the checkouts below use that commit, and the log
        # says which commit every later step measured.
        run: |
          set -euo pipefail
          resolve() {  # <owner/repo> <ref> <env var for the sha>
            local sha
            sha=$(git ls-remote "https://github.com/$1.git" "refs/heads/$2" "refs/tags/$2^{}" "refs/tags/$2" | head -1 | cut -f1)
            if [ -z "$sha" ] && [[ "$2" =~ ^[0-9a-f]{40}$ ]]; then sha="$2"; fi
            if [ -z "$sha" ]; then
              echo "::error::$1 has no branch, tag or commit '$2'. Refusing to fall back to any other ref."
              exit 1
            fi
            echo "RESOLVED: $1 @ $2 = $sha"
            echo "$3=$sha" >> "$GITHUB_ENV"
          }
          # did-schema: the requested ref, else the did-schema branch with this
          # NDI-matlab branch's name, else main ([NDI CI picks did-schema
          # branch], Jess Haley, 2026-10-27), the same rule as DID-matlab below.
          DID_SCHEMA_REF="${DID_SCHEMA_REQUESTED:-}"
          if [ -z "$DID_SCHEMA_REF" ] && [ -n "${NDI_BRANCH:-}" ] && [ "$NDI_BRANCH" != "main" ] \
             && [ -n "$(git ls-remote https://github.com/Waltham-Data-Science/did-schema.git "refs/heads/$NDI_BRANCH")" ]; then
            DID_SCHEMA_REF="$NDI_BRANCH"
          fi
          DID_SCHEMA_REF="${DID_SCHEMA_REF:-main}"
          echo "PICKED: did-schema ref $DID_SCHEMA_REF (requested '${DID_SCHEMA_REQUESTED:-}', NDI branch '${NDI_BRANCH:-}')"
          echo "DID_SCHEMA_REF=$DID_SCHEMA_REF" >> "$GITHUB_ENV"
          resolve Waltham-Data-Science/did-schema "$DID_SCHEMA_REF" DID_SCHEMA_SHA
          # DID-matlab: the requested ref, else the DID-matlab branch with this
          # NDI-matlab branch's name, else V2 ([NDI CI picks DID branch], Jess
          # Haley, 2026-10-25), so a DID/NDI pair is tested together.
          DID_MATLAB_REF="${DID_MATLAB_REQUESTED:-}"
          if [ -z "$DID_MATLAB_REF" ] && [ -n "${NDI_BRANCH:-}" ] && [ "$NDI_BRANCH" != "main" ] \
             && [ -n "$(git ls-remote https://github.com/VH-Lab/DID-matlab.git "refs/heads/$NDI_BRANCH")" ]; then
            DID_MATLAB_REF="$NDI_BRANCH"
          fi
          DID_MATLAB_REF="${DID_MATLAB_REF:-V2}"
          echo "PICKED: DID-matlab ref $DID_MATLAB_REF (requested '${DID_MATLAB_REQUESTED:-}', NDI branch '${NDI_BRANCH:-}')"
          echo "DID_MATLAB_REF=$DID_MATLAB_REF" >> "$GITHUB_ENV"
          resolve VH-Lab/DID-matlab "$DID_MATLAB_REF" DID_MATLAB_SHA

      - name: Check out did-schema (for V_eta schemas)
        uses: actions/checkout@v4
        with:
          repository: Waltham-Data-Science/did-schema
          ref: ${{ env.DID_SCHEMA_SHA }}
          path: did-schema

      - name: Check out DID-matlab (the resolved commit; put ahead of MatBox's copy)
        uses: actions/checkout@v4
        with:
          repository: VH-Lab/DID-matlab
          ref: ${{ env.DID_MATLAB_SHA }}
          path: did-matlab

      - name: Print the checked-out cross-repo commits
        run: |
          set -euo pipefail
          s=$(git -C did-schema rev-parse HEAD); d=$(git -C did-matlab rev-parse HEAD)
          echo "CHECKED OUT: did-schema ${DID_SCHEMA_REF} = ${s}"
          echo "CHECKED OUT: DID-matlab ${DID_MATLAB_REF} = ${d}"
          [ "$s" = "$DID_SCHEMA_SHA" ] || { echo "::error::did-schema is at $s, resolved $DID_SCHEMA_SHA"; exit 1; }
          [ "$d" = "$DID_MATLAB_SHA" ] || { echo "::error::DID-matlab is at $d, resolved $DID_MATLAB_SHA"; exit 1; }

      - name: Assemble V_eta schema set (tiered or flat)
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/eta-schemas"
          # Both layouts: the tiers (stable/, draft/, deprecated/ if present) and
          # the flat schemas/did_v2/*.json of [one folder, final classes only]
          # (Jess Haley, 2026-10-29); did_v2/ or V_eta/ ([schema set renamed
          # did_v2]). See the script's header.
          bash .github/scripts/assemble_did_schema_set.sh did-schema "${GITHUB_WORKSPACE}/eta-schemas"

      - name: Export env (schema path + eta test gate)
        run: |
          echo "DID_SCHEMA_PATH=${GITHUB_WORKSPACE}/eta-schemas" >> "$GITHUB_ENV"
          echo "NDI_TEST_ETA=1" >> "$GITHUB_ENV"

      - name: Start virtual display server
        run: |
          sudo apt-get install -y xvfb
          Xvfb :99 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: latest
          cache: true
          products: |
            Statistics_and_Machine_Learning_Toolbox

      - name: Install MatBox
        env:
          # MatBox resolves its dependencies through the GitHub API.
          # UNAUTHENTICATED that is 60 requests/hour per runner IP, so this step
          # fails on `rate limit exceeded` (403) in a way indistinguishable from
          # a real dependency break (the Soph run 32545423486 died here on
          # vhlab-library-matlab's getDefaultBranch). secrets.GITHUB_TOKEN is
          # minted per run, needs no setup, and raises the limit to 1000/hour.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: ehennestad/matbox-actions/install-matbox@v1

      - name: Point requirements at the DID-matlab V_eta branch
        # requirements.txt pins a DID-matlab that predates +migrators_j /
        # TargetVersion='V_eta'. Rewrite it to the V_eta branch so v1_to_v2
        # accepts TargetVersion='V_eta'.
        run: |
          set -eux
          python3 - <<'PY'
          import os, pathlib
          ref = os.environ["DID_MATLAB_REF"]
          for rel in ("requirements.txt", "tests/requirements.txt"):
              p = pathlib.Path(rel)
              if not p.exists():
                  continue
              out = []
              for line in p.read_text().splitlines():
                  if "DID-matlab" in line:
                      out.append(line.split("@", 1)[0] + "@" + ref)
                  else:
                      out.append(line)
              p.write_text("\n".join(out) + "\n")
          PY
          grep -i did-matlab requirements.txt tests/requirements.txt || true

      - name: Install repo dependencies (DID-matlab@V_eta, mksqlite, vhlab-toolbox)
        env:
          # Same rate-limit fix as Install MatBox above: installRequirements
          # resolves every dependency (DID-matlab, mksqlite, vhlab-toolbox,
          # vhlab-library) through the GitHub API, so it needs the token to stay
          # under the 1000/hour authenticated limit rather than the 60/hour IP one.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(genpath("src"));
            addpath(genpath("tools"));
            matbox.installRequirements(nditools.projectdir());
            matbox.installRequirements(fullfile(pwd, "tests"));

      - name: Run the B V_eta migrate end-to-end test
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(genpath("src"));
            addpath(genpath("tests"));
            % THE RESOLVED DID-matlab, ahead of whatever MatBox installed, and
            % proven: the run stops if did2 resolves anywhere else.
            addpath(genpath(fullfile(pwd, "did-matlab", "src")));
            didWhere = string(which("did2.convert.v1_to_v2"));
            disp("DID-matlab " + string(getenv("DID_MATLAB_REF")) + " @ " + string(getenv("DID_MATLAB_SHA")) + " from " + didWhere);
            assert(startsWith(didWhere, string(fullfile(pwd, "did-matlab"))), "did2 does not resolve to the checked-out DID-matlab: " + didWhere);
            % B ALONE. Hard-asserts corpus size, 0 quarantine / 0 orphans /
            % 0 fragments, that the session opens on the did2sqlite backend,
            % and that the stimulus pass reads B's 1242 presentations. The
            % fold / refusal split, parameter census, survivor set and
            % read-back counts are report-only. SKIPS (never fails) when the
            % corpus download is impossible.
            results = runtests('ndi.unittest.migrate.TestMigrateLocalEtaB');
            disp(results);
            assertSuccess(results);
