name: V_eta migrate assemblers (fast)

# Fast, focused gate for the V_eta second-pass assemblers
# (ndi.migrate.internal.*): the pure struct-assembly unit tests only -- no
# database, no schema cache, no cloud, no full toolbox suite -- so a change to
# stimulusBathToBath / stimulusPresentationToManipulation / bodyResolver /
# pathSPromotion / epochAnchorFold / ontologyRowSubjects / ontologyLabelSubjects
# is validated in a couple of minutes instead of the full run-tests.yml. The
# full suite stays the milestone gate.
#
# THE runtests LIST BELOW IS EXPLICIT, SO IT IS ALSO A PLACE WORK CAN HIDE: a
# test file that exists but is not named here does not run on a claude/**
# branch, because run-tests.yml (which would sweep the whole package) triggers
# only on main and Vnext. Two files sat in that gap. Add new
# tests/+ndi/+unittest/+migrate/Test*.m to the list in the same commit that
# adds the file.

on:
  push:
    branches: [main, 'claude/**']
    # NOTE: GitHub filter patterns treat '+' as a quantifier (one-or-more of the
    # preceding char), so a literal '+ndi'/'+migrate' in a paths glob never
    # matches the real MATLAB-package path -- the '*'-prefixed segments below
    # match the '+' as an ordinary character instead.
    paths:
      - 'src/ndi/*ndi/*migrate/**'
      - 'tests/*ndi/*unittest/*migrate/**'
      - '.github/workflows/test-eta-migrate.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eta-migrate:
    name: V_eta migrate assemblers (fast)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: latest
          cache: true
          products: Statistics_and_Machine_Learning_Toolbox

      - name: Install MatBox
        uses: ehennestad/matbox-actions/install-matbox@v1

      - name: Install repo requirements (did, deps)
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(genpath("src"));
            addpath(genpath("tools"));
            matbox.installRequirements(fullfile(nditools.projectdir(), "tests"));

      - name: Run V_eta migrate assembler tests (self-contained)
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(genpath("src"));
            addpath(genpath("tests"));
            % Parse-check local.m: its second-pass wiring (resolveDeferred /
            % resolveStimulusPresentations / resolvePathS) is NOT exercised by the
            % struct-assembly unit tests below, so force MATLAB to parse the whole
            % file (local functions included) to catch syntax / undefined-reference
            % errors cheaply. nargin() on the entry point does this.
            try
                nargin('ndi.migrate.local');
            catch ME
                error('ndi.migrate.local failed to parse: %s', ME.message);
            end
            % THIS LIST IS THE GATE, AND A TEST NOT IN IT IS NOT RUN AT ALL ON
            % a claude/** branch. run-tests.yml sweeps the whole package
            % (testToolboxNoCloud -> TestSuite.fromFolder("tests",
            % "IncludingSubfolders", true)), but it triggers only on
            % branches: ["main", "Vnext"], so it never fires here.
            %
            % RE-MEASURED 2026-08-11 (mechanically: every workflow file read,
            % every classdef line read, exact word-boundary match of each class
            % name against non-comment workflow lines). The previous
            % DENOMINATOR here said "16 .m / 15 TestCase" and was written in the
            % same commit that added the 17th file (TestEpochAnchorFold), so it
            % undercounted by one from the moment it was written:
            %
            %   DENOMINATOR: 11 workflow files, 11 read; 17 .m in
            %                tests/+ndi/+unittest/+migrate, of which 16 are
            %                matlab.unittest.TestCase (FakeCloudClient extends
            %                ndi.migrate.internal.cloudClient -- a stub, not a
            %                test).
            %   BEFORE this commit: 9 of 16 ran on a claude/** push -- the 8
            %                previously listed here plus TestMigrateLocalEta
            %                (test-eta-migrate-e2e.yml, also claude/**).
            %   ADDED here:  TestEnsembleMembership, TestSoftwareDedup,
            %                TestStrainAssembly. All three are pure struct
            %                assembly over ndi.migrate.internal.{ensembleMembership,
            %                softwareDedup,strainAssembly} -- no database, no
            %                schema cache, no cloud -- so they belong in this
            %                gate. They had never executed anywhere.
            %   NOW:         12 of 16 on a claude/** push.
            %   STILL NOT RUN on claude/**, each for a stated reason, none
            %                silently omitted:
            %     TestMigrateLocal        needs an on-disk v1 session + database
            %     TestMigrateCloud        needs the cloud client / FakeCloudClient
            %                             harness, and is swept by run-tests.yml
            %     TestMigrateLocalZeta    V_zeta target env; test-zeta-migrate.yml
            %                             (pull_request -> Vnext only)
            %     TestMigrateLocalEpsilon V_epsilon target env;
            %                             test-epsilon-migrate.yml
            %                             (pull_request -> Vnext only)
            %   NOTE a naive substring grep reports TestMigrateLocal as covered:
            %   "TestMigrateLocal" is a prefix of TestMigrateLocalEta/Zeta/
            %   Epsilon. It is named by NO workflow. Match on word boundaries.
            results = runtests([ ...
                "ndi.unittest.migrate.TestBathAssembly", ...
                "ndi.unittest.migrate.TestStimulusPresentation", ...
                "ndi.unittest.migrate.TestBodyResolver", ...
                "ndi.unittest.migrate.TestGratingValue", ...
                "ndi.unittest.migrate.TestPathSPromotion", ...
                "ndi.unittest.migrate.TestEpochAnchorFold", ...
                "ndi.unittest.migrate.TestOntologyRowSubjects", ...
                "ndi.unittest.migrate.TestOntologyLabelSubjects", ...
                "ndi.unittest.migrate.TestEnsembleMembership", ...
                "ndi.unittest.migrate.TestSoftwareDedup", ...
                "ndi.unittest.migrate.TestStrainAssembly"]);
            disp(table(results));
            assert(sum([results.Failed]) == 0, ...
                sprintf("%d migrate-assembler test(s) failed", sum([results.Failed])));
