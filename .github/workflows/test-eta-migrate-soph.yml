name: V_eta migrate Soph (on-demand)

# The Soph corpus (~101,427 v1 documents, ~446 MB compressed) through the
# WHOLE V_eta pipeline: ndi.migrate.local over the real corpus, then open the
# result through ndi.session.dir and read it back through the object API, with
# the element assembler exercised at Soph's scale (~1,647 element documents).
#
# WHY THIS IS ITS OWN, DISPATCH-ONLY WORKFLOW rather than a line in
# test-eta-migrate-e2e.yml. Soph is ~800x PRED. Migrating it inline alongside
# PRED, 20211116 and the ~20 assembler classes exhausted the standard runner
# and the e2e job was killed ~2h41m into the test step (run 84, 2026-08-19)
# without producing a census. Run alone, with a generous timeout, and never on
# every push: it does not gate the fast e2e check, and a Soph timeout/OOM here
# cannot turn that check red. Soph's MIGRATION (0 quarantine / 0 orphans) is
# also gated independently on the DID-matlab side (test-corpus.yml); what this
# workflow uniquely adds is the NDI object-layer read-back.
#
# The dep refs default to the same-name branch, else did-schema `main` and DID-matlab `V2` (DID_SCHEMA_REF
# and DID_MATLAB_REF below; #88 and #218 merged 2026-10-23); override the
# DID-matlab ref via the workflow_dispatch input if needed.

on:
  # Runs ONLY when Soph's own files change -- the test or this workflow -- so a
  # ~2-3h Soph run never rides on an unrelated push and never gates the fast
  # e2e check. This is the on-demand trigger usable from a feature branch:
  # workflow_dispatch below only becomes available once this file reaches the
  # default branch (a GitHub constraint), so the scoped push is what runs Soph
  # until then.
  #
  # 2026-09-23: touched to re-run Soph on the ndi_document2ndi_object read-path
  # fix (V2-merge break) on the fixed head, validating against did-schema main.
  #
  # PAUSED 2026-10-25 (Jess Haley: "Can we just stop running soph for now?"):
  # Soph no longer runs when its test changes, only when THIS file does.
  # workflow_dispatch is not offered (this file is not on the default
  # branch), so to run Soph by hand, bump the token below and push.
  #   soph-run-token: 1
  push:
    paths:
      - '.github/workflows/test-eta-migrate-soph.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'did-matlab / did-schema branch (V_eta line)'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # false: a push queues behind a run in progress instead of cancelling it.
  cancel-in-progress: false

jobs:
  eta_migrate_soph:
    name: V_eta Soph end-to-end (on-demand)
    runs-on: ubuntu-latest
    # Generous headroom under the 6-hour hosted-runner cap. Soph is the long
    # pole; run 84 was still migrating at 2h41m when the shared job died.
    timeout-minutes: 350
    env:
      # did-schema #88 merged into main and DID-matlab #218 into V2
      # (2026-10-23): validate against them. A workflow_dispatch input still
      # overrides the DID-matlab ref.
      DID_MATLAB_REQUESTED: ${{ inputs.ref }}
      NDI_BRANCH: ${{ github.head_ref || github.ref_name }}
      DID_SCHEMA_REQUESTED: ''
    steps:
      - name: Check out NDI-matlab
        uses: actions/checkout@v4

      - name: Resolve cross-repo refs (print them; fail if one is missing)
        # A requested ref that does not exist must STOP the run, never fall back
        # to a default branch: a run against the wrong did-schema / DID-matlab
        # reads exactly like a run against the right one. Each ref is resolved
        # to a commit here, the checkouts below use that commit, and the log
        # says which commit every later step measured.
        run: |
          set -euo pipefail
          resolve() {  # <owner/repo> <ref> <env var for the sha>
            local sha
            sha=$(git ls-remote "https://github.com/$1.git" "refs/heads/$2" "refs/tags/$2^{}" "refs/tags/$2" | head -1 | cut -f1)
            if [ -z "$sha" ] && [[ "$2" =~ ^[0-9a-f]{40}$ ]]; then sha="$2"; fi
            if [ -z "$sha" ]; then
              echo "::error::$1 has no branch, tag or commit '$2'. Refusing to fall back to any other ref."
              exit 1
            fi
            echo "RESOLVED: $1 @ $2 = $sha"
            echo "$3=$sha" >> "$GITHUB_ENV"
          }
          # did-schema: the requested ref, else the did-schema branch with this
          # NDI-matlab branch's name, else main ([NDI CI picks did-schema
          # branch], Jess Haley, 2026-10-27), the same rule as DID-matlab below.
          DID_SCHEMA_REF="${DID_SCHEMA_REQUESTED:-}"
          if [ -z "$DID_SCHEMA_REF" ] && [ -n "${NDI_BRANCH:-}" ] && [ "$NDI_BRANCH" != "main" ] \
             && [ -n "$(git ls-remote https://github.com/Waltham-Data-Science/did-schema.git "refs/heads/$NDI_BRANCH")" ]; then
            DID_SCHEMA_REF="$NDI_BRANCH"
          fi
          DID_SCHEMA_REF="${DID_SCHEMA_REF:-main}"
          echo "PICKED: did-schema ref $DID_SCHEMA_REF (requested '${DID_SCHEMA_REQUESTED:-}', NDI branch '${NDI_BRANCH:-}')"
          echo "DID_SCHEMA_REF=$DID_SCHEMA_REF" >> "$GITHUB_ENV"
          resolve Waltham-Data-Science/did-schema "$DID_SCHEMA_REF" DID_SCHEMA_SHA
          # DID-matlab: the requested ref, else the DID-matlab branch with this
          # NDI-matlab branch's name, else V2 ([NDI CI picks DID branch], Jess
          # Haley, 2026-10-25), so a DID/NDI pair is tested together.
          DID_MATLAB_REF="${DID_MATLAB_REQUESTED:-}"
          if [ -z "$DID_MATLAB_REF" ] && [ -n "${NDI_BRANCH:-}" ] && [ "$NDI_BRANCH" != "main" ] \
             && [ -n "$(git ls-remote https://github.com/VH-Lab/DID-matlab.git "refs/heads/$NDI_BRANCH")" ]; then
            DID_MATLAB_REF="$NDI_BRANCH"
          fi
          DID_MATLAB_REF="${DID_MATLAB_REF:-V2}"
          echo "PICKED: DID-matlab ref $DID_MATLAB_REF (requested '${DID_MATLAB_REQUESTED:-}', NDI branch '${NDI_BRANCH:-}')"
          echo "DID_MATLAB_REF=$DID_MATLAB_REF" >> "$GITHUB_ENV"
          resolve VH-Lab/DID-matlab "$DID_MATLAB_REF" DID_MATLAB_SHA

      - name: Check out did-schema (for V_eta schemas)
        uses: actions/checkout@v4
        with:
          repository: Waltham-Data-Science/did-schema
          ref: ${{ env.DID_SCHEMA_SHA }}
          path: did-schema

      - name: Check out DID-matlab (the resolved commit; put ahead of MatBox's copy)
        uses: actions/checkout@v4
        with:
          repository: VH-Lab/DID-matlab
          ref: ${{ env.DID_MATLAB_SHA }}
          path: did-matlab

      - name: Print the checked-out cross-repo commits
        run: |
          set -euo pipefail
          s=$(git -C did-schema rev-parse HEAD); d=$(git -C did-matlab rev-parse HEAD)
          echo "CHECKED OUT: did-schema ${DID_SCHEMA_REF} = ${s}"
          echo "CHECKED OUT: DID-matlab ${DID_MATLAB_REF} = ${d}"
          [ "$s" = "$DID_SCHEMA_SHA" ] || { echo "::error::did-schema is at $s, resolved $DID_SCHEMA_SHA"; exit 1; }
          [ "$d" = "$DID_MATLAB_SHA" ] || { echo "::error::DID-matlab is at $d, resolved $DID_MATLAB_SHA"; exit 1; }

      - name: Assemble V_eta schema set (stable + draft)
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/eta-schemas"
          # [schema set renamed did_v2] (Jess Haley, 2026-10-25), step 1 "accept
          # both names": schemas/did_v2/ when the checkout has it, else
          # schemas/V_eta/; deprecated/ (the v1 passthrough shapes) only if present.
          SET=did-schema/schemas/did_v2; [ -d "$SET" ] || SET=did-schema/schemas/V_eta
          echo "SCHEMA SET: $SET"
          cp "$SET"/stable/*.json "${GITHUB_WORKSPACE}/eta-schemas/"
          cp "$SET"/draft/*.json  "${GITHUB_WORKSPACE}/eta-schemas/"
          if [ -d "$SET/deprecated" ]; then cp "$SET"/deprecated/*.json "${GITHUB_WORKSPACE}/eta-schemas/"; fi

      - name: Export env (schema path + eta test gate)
        run: |
          echo "DID_SCHEMA_PATH=${GITHUB_WORKSPACE}/eta-schemas" >> "$GITHUB_ENV"
          echo "NDI_TEST_ETA=1" >> "$GITHUB_ENV"

      - name: Start virtual display server
        run: |
          sudo apt-get install -y xvfb
          Xvfb :99 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: latest
          cache: true
          products: |
            Statistics_and_Machine_Learning_Toolbox

      - name: Install MatBox
        env:
          # MatBox resolves its dependencies through the GitHub API.
          # UNAUTHENTICATED that is 60 requests/hour per runner IP, so this step
          # fails on `rate limit exceeded` (403) in a way indistinguishable from
          # a real dependency break -- run 32545423486 died here on
          # vhlab-library-matlab's getDefaultBranch. secrets.GITHUB_TOKEN is
          # minted per run, needs no setup, and raises the limit to 1000/hour.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: ehennestad/matbox-actions/install-matbox@v1

      - name: Point requirements at the DID-matlab V_eta branch
        # requirements.txt pins a DID-matlab that predates +migrators_j /
        # TargetVersion='V_eta'. Rewrite it to the V_eta branch so v1_to_v2
        # accepts TargetVersion='V_eta'.
        run: |
          set -eux
          python3 - <<'PY'
          import os, pathlib
          ref = os.environ["DID_MATLAB_REF"]
          for rel in ("requirements.txt", "tests/requirements.txt"):
              p = pathlib.Path(rel)
              if not p.exists():
                  continue
              out = []
              for line in p.read_text().splitlines():
                  if "DID-matlab" in line:
                      out.append(line.split("@", 1)[0] + "@" + ref)
                  else:
                      out.append(line)
              p.write_text("\n".join(out) + "\n")
          PY
          grep -i did-matlab requirements.txt tests/requirements.txt || true

      - name: Install repo dependencies (DID-matlab@V_eta, mksqlite, vhlab-toolbox)
        env:
          # Same rate-limit fix as Install MatBox above: installRequirements
          # resolves every dependency (DID-matlab, mksqlite, vhlab-toolbox,
          # vhlab-library) through the GitHub API, so it needs the token to stay
          # under the 1000/hour authenticated limit rather than the 60/hour IP one.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(genpath("src"));
            addpath(genpath("tools"));
            matbox.installRequirements(nditools.projectdir());
            matbox.installRequirements(fullfile(pwd, "tests"));

      - name: Add a swapfile (memory exhaustion becomes slowness)
        # The #88-pipeline Soph runs lost their runner ("The runner has received
        # a shutdown signal") at a consistent work point inside
        # ndi.migrate.local, which fits the VM running out of memory. A swapfile
        # turns that into slowness the 350-minute timeout and the sampler below
        # can show. GUARDED: it goes on whichever of / and /mnt has the most
        # free space, only if 20 GB stay free for the corpus and the migrated
        # database after it, and a failure here never fails the job.
        continue-on-error: true
        run: |
          set -x
          free -m || true
          swapon --show || true
          df -h / /mnt || true
          best=""; bestAvail=0
          for d in /mnt /; do
            a=$(df --output=avail -BG "$d" 2>/dev/null | tail -1 | tr -dc 0-9)
            if [ -n "$a" ] && [ "$a" -gt "$bestAvail" ]; then best="$d"; bestAvail="$a"; fi
          done
          size=$(( bestAvail - 20 )); [ "$size" -gt 16 ] && size=16
          if [ -z "$best" ] || [ "$size" -lt 4 ]; then
            echo "SWAP: not added (most free space ${bestAvail} GB on '${best}'; keeping 20 GB free)"
            exit 0
          fi
          f="${best%/}/soph-swapfile"
          if sudo fallocate -l "${size}G" "$f" && sudo chmod 600 "$f" && sudo mkswap "$f" && sudo swapon "$f"; then
            echo "SWAP: added ${size} GB at $f"
          else
            echo "SWAP: adding ${size} GB at $f FAILED; continuing without it"
          fi
          free -m || true
          swapon --show || true

      - name: Write the memory sampler
        # Every 60 s: date, free -m, df -h /, and the MATLAB process RSS. The
        # MATLAB step below starts it with its output aimed at MATLAB's own
        # stdout (/proc/<pid>/fd/1), which is that step's live log, so the last
        # samples survive a lost runner. It also appends to
        # $RUNNER_TEMP/soph-sampler.log, printed by the last step when the
        # runner survives. It stops when the MATLAB process it watches exits.
        # Instrumentation only. (A shell step running `matlab -batch` or
        # `matlab-batch` cannot be used instead: neither finds a license on the
        # hosted runner, runs 39743874596 and 39744771099.)
        run: |
          cat > "$RUNNER_TEMP/soph_sampler.sh" <<'SAMPLER'
          #!/bin/bash
          # soph_sampler.sh <pid to watch> <file to also write to, e.g. /proc/<pid>/fd/1>
          watch="$1"; out="$2"; log="${RUNNER_TEMP:-/tmp}/soph-sampler.log"
          while kill -0 "$watch" 2>/dev/null; do
            {
              date -u +%FT%TZ
              free -m
              df -h /
              ps -o rss,cmd -C MATLAB --sort=-rss 2>/dev/null | head -3 | cut -c1-160
            } 2>&1 | sed 's/^/[sampler] /' | tee -a "$log" >> "$out" 2>/dev/null
            sleep 60
          done
          SAMPLER
          chmod +x "$RUNNER_TEMP/soph_sampler.sh"
          bash -n "$RUNNER_TEMP/soph_sampler.sh"

      - name: Run the Soph V_eta migrate end-to-end test
        uses: matlab-actions/run-command@v2
        with:
          command: |
            % THE MEMORY SAMPLER (instrumentation only): written by the step
            % above, aimed at this process's stdout, i.e. this step's live log.
            % A failure here never stops the test.
            try
                samplerPid = feature('getpid');
                samplerSh = fullfile(getenv("RUNNER_TEMP"), "soph_sampler.sh");
                [samplerStatus, samplerOut] = system(sprintf('nohup bash "%s" %d "/proc/%d/fd/1" > /dev/null 2>&1 &', samplerSh, samplerPid, samplerPid));
                disp("memory sampler started for MATLAB pid " + string(samplerPid) + " (status " + string(samplerStatus) + ") " + string(samplerOut));
            catch samplerErr
                disp("memory sampler NOT started: " + string(samplerErr.message));
            end
            addpath(genpath("src"));
            addpath(genpath("tests"));
            % THE RESOLVED DID-matlab, ahead of whatever MatBox installed, and
            % proven: the run stops if did2 resolves anywhere else.
            addpath(genpath(fullfile(pwd, "did-matlab", "src")));
            didWhere = string(which("did2.convert.v1_to_v2"));
            disp("DID-matlab " + string(getenv("DID_MATLAB_REF")) + " @ " + string(getenv("DID_MATLAB_SHA")) + " from " + didWhere);
            assert(startsWith(didWhere, string(fullfile(pwd, "did-matlab"))), "did2 does not resolve to the checked-out DID-matlab: " + didWhere);
            % Soph ALONE. On this first landing the test is report-only on its
            % two census methods and its multi-session read-back counts
            % (Soph's exact pass-1 unconverted set and final survivor set are
            % MEASURED here before they are asserted); it hard-asserts
            % 0 quarantine / 0 orphans, that the session opens on the
            % did2sqlite backend, and calculator id-preservation. It SKIPS
            % (never fails) when the corpus download is impossible.
            results = runtests('ndi.unittest.migrate.TestMigrateLocalEtaSoph');
            disp(results);
            assertSuccess(results);

      - name: Print the memory samples (when the runner survived)
        if: always()
        run: |
          f="$RUNNER_TEMP/soph-sampler.log"
          if [ -f "$f" ]; then echo "$(grep -cE '^\[sampler\] [0-9]{4}-' "$f") sample(s); the last 120 lines:"; tail -n 120 "$f"; else echo "no sampler log at $f"; fi
